name: 4-Times-Daily Analytics Telemetry Renew

on:
  schedule:
    # Runs 4 times a day (every 6 hours at 00:00, 06:00, 12:00, 18:00 UTC)
    # Taipei Time: 08:00, 14:00, 20:00, 02:00
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  renew-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 google-analytics-data google-auth

      - name: Fetch GA4 Telemetry Data
        env:
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
        run: |
          python scripts/fetch_analytics.py

      - name: Commit and push updated telemetry data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/endpoints.json index.html
          if git diff --staged --quiet; then
            echo "No telemetry changes to commit."
          else
            git commit -m "chore(telemetry): 4-times-daily GA4 data renewal [skip ci]"
            git push
          fi
