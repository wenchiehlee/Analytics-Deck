  <text x="60" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="12" fill="#0f172a" letter-spacing="3" text-anchor="middle">CAT</text>
  <text x="60" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="5" fill="#0284c7" letter-spacing="1.5" text-anchor="middle">― CLOUD SENTINEL ―</text>
