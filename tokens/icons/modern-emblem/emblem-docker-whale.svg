<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="whale-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#2496ed" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="container-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="container-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Background circular disc -->
  <circle cx="60" cy="48" r="38" fill="#eff8ff" stroke="#bae6fd" stroke-width="1.2"/>

  <!-- Stacked Cargo Containers (Ref: VectorStock 56880730) -->
  <!-- Top Center Container -->
  <g id="top-container">
    <rect x="58" y="21" width="16" height="9.5" rx="1" fill="url(#container-base)" stroke="#0369a1" stroke-width="1"/>
    <!-- Vertical Corrugations -->
    <line x1="61" y1="22.5" x2="61" y2="29" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
    <line x1="63.5" y1="22.5" x2="63.5" y2="29" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
    <line x1="66" y1="22.5" x2="66" y2="29" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
    <line x1="68.5" y1="22.5" x2="68.5" y2="29" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
    <line x1="71" y1="22.5" x2="71" y2="29" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Bottom Left Container -->
  <g id="bottom-left-container">
    <rect x="43" y="30.5" width="19" height="10.5" rx="1" fill="url(#container-dark)" stroke="#0369a1" stroke-width="1"/>
    <line x1="46.5" y1="32" x2="46.5" y2="39.5" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
    <line x1="49.5" y1="32" x2="49.5" y2="39.5" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
    <line x1="52.5" y1="32" x2="52.5" y2="39.5" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
    <line x1="55.5" y1="32" x2="55.5" y2="39.5" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
    <line x1="58.5" y1="32" x2="58.5" y2="39.5" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Bottom Right Container -->
  <g id="bottom-right-container">
    <rect x="63" y="30.5" width="20" height="10.5" rx="1" fill="url(#container-dark)" stroke="#0369a1" stroke-width="1"/>
    <line x1="66.5" y1="32" x2="66.5" y2="39.5" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
    <line x1="69.5" y1="32" x2="69.5" y2="39.5" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
    <line x1="72.5" y1="32" x2="72.5" y2="39.5" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
    <line x1="75.5" y1="32" x2="75.5" y2="39.5" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
    <line x1="78.5" y1="32" x2="78.5" y2="39.5" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Whale Main Body (Ref: VectorStock 56880730) -->
  <path d="M 21 43
           C 25 38, 38 37, 54 38
           L 84 39
           C 93 42, 97 45, 96 40
           C 95 32, 94 23, 100 23
           C 103 23, 103 27, 101 31
           C 106 30, 109 32, 107 35
           C 103 41, 95 47, 88 54
           C 80 61, 71 64, 63 63
           C 60 66, 58 72, 54 73
           C 51 74, 48 70, 49 63
           C 41 63, 33 58, 27 52
           C 23 49, 20 46, 21 43 Z"
        fill="url(#whale-body)"
        stroke="#0369a1"
        stroke-width="1.8"
        stroke-linejoin="round"/>

  <!-- Throat Ventral Grooves / Pleats (Ref: VectorStock 56880730) -->
  <!-- Pleat 1 -->
  <path d="M 23 44
           C 24 53, 31 61, 44 63
           C 49 63, 51 61, 53 58"
        fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Pleat 2 -->
  <path d="M 26 44
           C 27 51, 33 57, 42 59
           C 46 59, 48 57, 50 54"
        fill="none" stroke="#bae6fd" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Pleat 3 -->
  <path d="M 29 44
           C 30 49, 35 53, 41 55"
        fill="none" stroke="#7dd3fc" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Pectoral Flipper Shadow Accent -->
  <path d="M 50 63 C 51 68, 54 71, 56 70 C 55 66, 53 63, 51 62 Z" fill="#0369a1"/>

  <!-- Friendly Tech Eye -->
  <circle cx="37" cy="46" r="2.4" fill="#ffffff"/>
  <circle cx="37" cy="46" r="1.4" fill="#0369a1"/>

  <!-- Brand Typography -->
  <text x="60" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="10.5" fill="#075985" letter-spacing="2" text-anchor="middle">DOCKER-DECK</text>
  <text x="60" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="4.5" fill="#0284c7" letter-spacing="1.4" text-anchor="middle">― CONTAINER DIRECTORY ―</text>
</svg>